name: Update GitHub Trending Data

on:
  schedule:
    # 每周五 UTC 00:00 自动运行（北京时间上午 08:00）
    - cron: "0 0 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trending-update
  cancel-in-progress: false

jobs:
  update-trending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Trending data
        id: fetch
        run: node scripts/fetch-trending.js

      # 自动补写本周周报。已存在同名周报（含手写稿）时脚本会跳过，
      # 因此手写内容始终优先，不会被覆盖。
      - name: Generate weekly post
        id: post
        run: node scripts/generate-weekly-post.js

      - name: Verify content
        run: npx astro check

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/trending-data.json src/content/blog; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/trending-data.json src/content/blog
          if git diff --cached --quiet; then
            echo "nothing staged, skipping"
            exit 0
          fi
          if git diff --cached --name-only | grep -q 'src/content/blog/'; then
            git commit -m "chore(trending): update weekly github trending data and auto-generate post"
          else
            git commit -m "chore(trending): update weekly github trending data"
          fi
          git push
